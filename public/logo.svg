<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12161E"/>
      <stop offset="100%" stop-color="#1B222D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="16" y1="16" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3DFB0"/>
      <stop offset="45%" stop-color="#D4A745"/>
      <stop offset="100%" stop-color="#9B7020"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="20" y1="60" x2="60" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E26D5C"/>
      <stop offset="100%" stop-color="#F2A69A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4A745" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container badge with premium border -->
  <rect x="2" y="2" width="76" height="76" rx="18" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  
  <!-- Subtle anatomical grid lines -->
  <circle cx="40" cy="40" r="28" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="40" cy="40" r="18" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Geometric Interlocking N & M Monogram (Anatomical Ribbon) -->
  <g filter="url(#softGlow)">
    <!-- Letter N Path -->
    <path d="M22 56V24L38 48V24" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter M & Medical V-Cross Path -->
    <path d="M42 56V32L50 44L58 32V56" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Organic vitality pulse dot (Anatomy heart/vital energy) -->
    <circle cx="38" cy="24" r="2.8" fill="url(#coralGrad)"/>
    <circle cx="58" cy="24" r="2.8" fill="url(#goldGrad)"/>
  </g>
</svg>
